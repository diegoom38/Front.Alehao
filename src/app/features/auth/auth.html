<div class="min-h-screen bg-white font-sans antialiased flex flex-col md:flex-row">

  <section class="relative w-full md:w-[60%] min-h-[40vh] md:min-h-screen flex items-end p-8 md:p-20 overflow-hidden">
    <div class="absolute inset-0 z-0">
      <img src="https://images.unsplash.com/photo-1450778869180-41d0601e046e?auto=format&fit=crop&q=80&w=1500"
        alt="Cão e humano" class="w-full h-full object-cover grayscale-[30%] brightness-[0.4]">
      <div class="absolute inset-0 bg-gradient-to-t from-[var(--color-primary)]/80 via-transparent to-black/40"></div>
    </div>

    <div class="relative z-10 max-w-xl">
      <div class="bg-[var(--color-secondary)] p-3 rounded-2xl shadow-lg w-fit mb-6 transform -rotate-3">
        <span class="text-3xl">🐾</span>
      </div>
      <h2 class="text-4xl md:text-6xl font-black text-white leading-tight mb-6">
        A luz que guia o <span class="text-[var(--color-secondary)]">resgate</span>.
      </h2>
      <p class="text-lg md:text-xl text-blue-50 font-medium italic opacity-90">
        "Para o mundo, você é apenas uma pessoa. Para um animal resgatado, você é o milagre enviado."
      </p>
    </div>

    <div class="absolute top-8 left-8 z-10 flex items-center gap-2">
      <span class="text-white font-black tracking-tighter text-2xl">ALEHAO</span>
      <span class="w-2 h-2 rounded-full bg-[var(--color-secondary)] animate-ping"></span>
    </div>
  </section>

  <section class="w-full md:w-[40%] bg-white flex flex-col justify-center p-8 md:p-16 relative">
    <a href="#" class="absolute top-8 right-8 text-slate-400 hover:text-[var(--color-primary)] transition">
      <span class="text-2xl font-light">✕</span>
    </a>

    <div class="max-w-sm mx-auto w-full">
      <header class="mb-10 text-center md:text-left">
        <h3 class="text-3xl font-black text-slate-900 mb-2">Portal do <span
            class="text-[var(--color-primary)]">Anjo</span></h3>
        <p class="text-slate-500 font-bold text-sm uppercase tracking-tighter">Acesso restrito para instituições</p>
      </header>

      <form class="space-y-6">
        <div class="space-y-2">
          <app-input label="E-mail Institucional" placeholder="ong@alehao.org"></app-input>
        </div>

        <div class="space-y-2">
          <app-input label="Senha de Missão" type="password" placeholder="••••••••"></app-input>
        </div>

        <app-button [fullWidth]="true" [label]="'ENTRAR NA MISSÃO'" [routerLink]="['/institucional']"></app-button>

        <div class="relative py-4">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-slate-100"></div>
          </div>
          <div class="relative flex justify-center text-xs uppercase font-bold text-slate-300"><span
              class="bg-white px-2 tracking-widest">ou</span></div>
        </div>

        <app-button type="secondary" [label]="'Solicitar Novo Credenciamento'" [fullWidth]="true"></app-button>
      </form>

      <footer class="mt-12 text-center">
        <p class="text-[10px] text-slate-300 font-bold uppercase tracking-[0.2em]">
          "Criada por quem escuta o silêncio."
        </p>
      </footer>
    </div>
  </section>
</div>
