<div class="max-w-8xl mx-auto">

  <!-- Filtros -->
  <div
    class="flex justify-between items-end pb-4 md:flex-row md:items-end flex-col gap-4 border-b"
    [style.background-color]="'var(--bg-secondary)'"
    [style.border-color]="'var(--border-primary)'"
  >
    <div class="flex flex-col md:flex-row gap-3 w-full">
      <app-input
        class="w-full md:w-[220px]"
        label="Buscar evento"
        placeholder="Feira de adoção"
      ></app-input>

      <app-select
        class="w-full md:w-[220px]"
        [options]="statusOptions()"
        label="Status"
      ></app-select>
    </div>

    <app-button
      class="min-w-[175px]"
      label="Novo Evento"
    ></app-button>
  </div>

  <!-- Grid -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 pt-8">

    @for (item of [].constructor(8); track $index) {

    <app-base-card [routerLink]="['../detalhes', 2031]">

      <!-- Header -->
      <div class="flex items-center gap-4 mb-4">

        <div
          class="w-14 h-14 rounded-xl flex items-center justify-center text-xl"
          [style.background-color]="'var(--bg-tertiary)'"
        >
          🐾
        </div>

        <div>
          <p
            class="font-semibold"
            [style.color]="'var(--text-primary)'"
          >
            Feira de Adoção Solidária
          </p>
        </div>
      </div>

      <!-- Infos -->
      <div
        class="text-sm space-y-1"
        [style.color]="'var(--text-secondary)'"
      >
        <p>📅 28 Abril 2026</p>
        <p>📍 São Paulo - SP</p>
        <p>🎯 Evento de adoção</p>
      </div>

      <!-- Footer -->
      <div class="mt-4 flex justify-between items-center">
        <app-tag
          label="Publicado"
          color="green"
        ></app-tag>

        <span [style.color]="'var(--text-muted)'">
          →
        </span>
      </div>

    </app-base-card>
    }

  </div>

  <app-paginator></app-paginator>

</div>
