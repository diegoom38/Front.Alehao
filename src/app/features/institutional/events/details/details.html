<!-- HEADER -->
<header class="border-b" [style.background-color]="'var(--bg-secondary)'"
  [style.border-color]="'var(--border-primary)'">
  <div class="max-w-8xl mx-auto pb-4 flex items-center justify-between">

    <div>
      <h1 class="text-2xl font-bold" [style.color]="'var(--text-primary)'">
        Feira de Adoção Solidária
      </h1>

      <p class="text-sm" [style.color]="'var(--text-secondary)'">
        Detalhes do evento
      </p>
    </div>

    <app-button label="Editar"></app-button>
  </div>
</header>

<!-- CONTENT -->
<main class="max-w-8xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-4 mt-8">

  <!-- INFOS -->
  <div class="flex flex-col gap-4">

    <app-base-card header="Status">
      <app-tag label="Publicado" color="green"></app-tag>
    </app-base-card>

    <app-base-card header="ONG Responsável">
      <p class="text-sm" [style.color]="'var(--text-primary)'">
        ONG Amor Animal
      </p>
    </app-base-card>

    <app-base-card header="Data do Evento">
      <p class="text-lg font-bold" [style.color]="'var(--text-primary)'">
        28 Abril 2026
      </p>
    </app-base-card>

    <app-base-card header="Local">
      <p class="text-sm" [style.color]="'var(--text-primary)'">
        Avenida Paulista, São Paulo - SP
      </p>
    </app-base-card>

  </div>

  <!-- DETALHES -->
  <div class="lg:col-span-2">
    <app-base-card>
      <h3 class="text-lg font-semibold mb-4" [style.color]="'var(--text-primary)'">
        Informações do Evento
      </h3>
      <div class="grid gap-4">

        <!-- Tipo -->
        <app-base-card header="Tipo do Evento">
          <div class="flex flex-col gap-2">
            <p class="text-sm" [style.color]="'var(--text-secondary)'">
              Evento beneficente para adoção responsável
            </p>
            <app-tag label="Adoção"></app-tag>
          </div>

        </app-base-card>

        <!-- Contato -->
        <app-base-card header="Contato">
          <div class="flex flex-col gap-2">
            <p class="text-sm" [style.color]="'var(--text-secondary)'">
              (11) 99999-9999
            </p>

            <app-tag label="WhatsApp"></app-tag>
          </div>

        </app-base-card>

        <!-- Descrição -->

        <p class="font-medium mb-1" [style.color]="'var(--text-primary)'">
          Descrição do evento
        </p>

        <app-rich-text></app-rich-text>
      </div>
    </app-base-card>
  </div>
</main>
