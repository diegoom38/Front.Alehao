<!-- KPIs -->
<div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">

  <app-base-card header="Casos em Aberto">
    <h3 class="text-3xl font-black text-[var(--text-primary)]">
      {{ totalOpen() }}
    </h3>
  </app-base-card>

  <app-base-card header="Prioridade Crítica">
    <h3 class="text-3xl font-black text-red-500">
      {{ criticalToday() }}
    </h3>
  </app-base-card>

  <app-base-card header="Aguardando Ação">
    <h3 class="text-3xl font-black text-[var(--text-primary)]">
      12
    </h3>
  </app-base-card>

  <app-base-card header="Vidas Salvas">
    <h3 class="text-3xl font-black text-green-500">
      {{ resolvedCount() }}
    </h3>
  </app-base-card>

</div>


<!-- GRID PRINCIPAL -->
<div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

  <!-- MAPA -->
  <app-base-card class="lg:col-span-2 flex flex-col">

    <!-- HEADER -->
    <div class="flex justify-between items-center mb-4">
      <h2 class="font-semibold flex items-center gap-2 text-[var(--text-primary)]">
        <span class="text-[var(--color-primary)]">📍</span>
        Mapa de Incidência Operacional
      </h2>

      <div class="flex gap-3 text-xs font-semibold uppercase">
        <span class="flex items-center gap-1 text-[var(--text-secondary)]">
          <span class="w-2.5 h-2.5 rounded-full bg-red-500"></span>
          Crítico
        </span>

        <span class="flex items-center gap-1 text-[var(--text-secondary)]">
          <span class="w-2.5 h-2.5 rounded-full bg-[var(--color-primary)]"></span>
          Novo
        </span>

      </div>

    </div>

    <!-- MAP -->
    <div
      class="flex-1 rounded-xl border border-dashed
             border-[var(--border-primary)]
             bg-[var(--bg-secondary)]
             overflow-hidden h-[504px]"
    >
      <div
        id="map"
        class="w-full h-full flex items-center justify-center text-sm text-[var(--text-secondary)]"
      >
        Mapa carregando...
      </div>
    </div>

  </app-base-card>



  <!-- FILA -->
  <app-base-card class="flex flex-col">

    <h2 class="font-semibold mb-6 flex items-center gap-2 text-[var(--text-primary)]">
      <span class="text-[var(--color-secondary)]">📋</span>
      Fila de Atendimento
    </h2>

    <div class="space-y-3 overflow-y-auto max-h-[450px] pr-1">

      @for (report of reports(); track report.id) {
      <div
        class="group p-4 rounded-xl border-l-4 transition cursor-pointer
               bg-[var(--bg-secondary)] border-[var(--border-primary)]
               hover:bg-[var(--bg-tertiary)]"
        [ngClass]="{
          'border-red-500': report.priority === 'ALTA'
        }"
      >

        <div class="flex justify-between items-start mb-2">

          <app-tag [label]="report.priority"></app-tag>

          <span class="text-[10px] font-mono text-[var(--text-muted)]">
            #{{ report.id }}
          </span>

        </div>

        <h4 class="font-semibold text-[var(--text-primary)]">
          {{ report.type }}
        </h4>

        <p class="text-sm text-[var(--text-secondary)] truncate mb-3">
          {{ report.address }}
        </p>

        <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition">
          <app-button label="Assumir"></app-button>
          <app-button label="Detalhes" type="secondary"></app-button>
        </div>

      </div>
      }

    </div>

    <app-button [fullWidth]="true" label="Ver Todos os Casos" class="mt-6"></app-button>

  </app-base-card>

</div>
