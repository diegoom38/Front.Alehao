<div class="min-h-screen flex font-sans bg-[var(--bg-secondary)] text-[var(--text-primary)]">

  <!-- SIDEBAR -->
  <aside
    [class.w-56]="!collapsed()"
    [class.w-24]="collapsed()"
    class="relative flex flex-col py-6 transition-all duration-300 ease-out shadow-xl z-20 bg-[var(--sidebar-bg)]"
  >

    <!-- TOGGLE -->
    <button
      (click)="toggle()"
      class="absolute -right-3 top-10 w-6 h-6 border rounded-full flex items-center justify-center shadow-md transition bg-[var(--sidebar-bg)] border-[var(--sidebar-border)]"
    >
      <svg
        class="h-3 w-3 transition-transform"
        [class.rotate-180]="collapsed()"
        fill="none"
        viewBox="0 0 24 24"
        stroke="var(--sidebar-text)"
      >
        <path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
      </svg>
    </button>

    <!-- LOGO -->
    <div class="mb-10 flex justify-center">
      <div class="w-16 h-16 rounded-2xl flex items-center justify-center shadow-sm bg-[var(--bg-secondary)]">
        <img src="alehao-logo-no-bg.png" class="w-10 h-10 object-contain">
      </div>
    </div>

    <!-- MENU -->
    <nav class="flex-1 px-3 space-y-1.5">

      @for (item of menu(); track item.label) {
      <a
        [routerLink]="[item.route]"
        routerLinkActive="active-link"
        class="group relative flex items-center p-3 rounded-xl transition-all duration-200 text-[var(--sidebar-text)] hover:bg-[var(--sidebar-bg-hover)]"
        [class.justify-center]="collapsed()"
      >

        <!-- ICON -->
        <span class="material-symbols-outlined transition-transform duration-200 group-hover:rotate-6">
          {{ item.iconName }}
        </span>

        <!-- LABEL -->
        @if (!collapsed()) {
        <span class="ml-3 font-medium group-hover:text-[var(--sidebar-text-active)]">
          {{ item.label }}
        </span>
        }

        <!-- TOOLTIP -->
        @if (collapsed()) {
        <span
          class="absolute left-16 text-xs px-3 py-1.5 rounded-md border
                 opacity-0 group-hover:opacity-100 transition-all duration-200
                 translate-x-[-10px] group-hover:translate-x-0 whitespace-nowrap pointer-events-none
                 bg-[var(--bg-tertiary)] text-[var(--text-primary)] border-[var(--border-primary)] shadow-xl"
        >
          {{ item.label }}
        </span>
        }

      </a>
      }

    </nav>

    <!-- USER -->
    <div class="mt-auto px-3 pt-4 border-t border-[var(--sidebar-border)]">
      <div class="flex items-center p-2 rounded-xl hover:bg-[var(--sidebar-bg-hover)] cursor-pointer transition"
        [class.justify-center]="collapsed()">

        <div class="relative">
          <img src="https://ui-avatars.com/api/?name=Ricardo&background=4A90E2&color=fff"
            class="w-9 h-9 rounded-lg border border-[var(--sidebar-border)]">
          <div
            class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-green-500 border-2 border-[var(--sidebar-bg)] rounded-full">
          </div>
        </div>

        @if (!collapsed()) {
        <div class="ml-3">
          <p class="text-sm font-semibold text-white truncate">Dr. Ricardo</p>
          <p class="text-[11px] text-[var(--sidebar-text)] truncate">Administrador</p>
        </div>
        }
      </div>
    </div>

  </aside>

  <!-- CONTENT -->
  <main class="flex-1 overflow-y-auto bg-[var(--bg-secondary)]">

    <header class="h-24 border-b backdrop-blur flex flex-col justify-center px-8 border-[var(--border-primary)] bg-[var(--bg-tertiary)]">
      <div class="flex justify-between items-center">
        <div>
          <h1 class="text-2xl font-bold text-[var(--text-primary)]">
            Painel de Comando Alehao
          </h1>
          <p class="text-[var(--text-secondary)]">
            Monitoramento em tempo real de bem-estar animal
          </p>
        </div>

        <app-dark-mode-toggle></app-dark-mode-toggle>
      </div>
    </header>

    <div class="p-8">
      <router-outlet />
    </div>

  </main>
</div>
