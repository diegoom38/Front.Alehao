<div class="min-h-screen bg-slate-50 flex text-slate-900 font-sans">

  <!-- SIDEBAR -->
  <aside [class.w-56]="!collapsed()" [class.w-24]="collapsed()"
    class="relative flex flex-col py-6 transition-all duration-300 ease-out shadow-xl z-20 bg-[var(--color-primary)]">

    <!-- Toggle -->
    <button (click)="toggle()"
      class="absolute -right-3 top-10 w-6 h-6 border rounded-full flex items-center justify-center bg-[var(--color-primary)] border-[var(--sidebar-border)] shadow-md">
      <svg class="h-3 w-3 transition-transform" [class.rotate-180]="collapsed()" fill="none" viewBox="0 0 24 24"
        stroke="var(--sidebar-text)">
        <path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
      </svg>
    </button>

    <!-- Logo -->
    <div
      class="mb-10 flex items-center gap-4 w-20 h-20 overflow-hidden bg-white rounded-full flex items-center justify-center mx-auto">
      <img src="alehao-logo-no-bg.png" alt="Alehao Logo" class="w-14 h-14 object-contain">
    </div>

    <!-- MENU -->
    <nav class="flex-1 px-3 space-y-1.5">

      @for (item of menu(); track item.label) {
      <a [routerLink]="[item.route]" routerLinkActive="active-link" class="group relative flex items-center p-3 rounded-xl transition-all duration-300 ease-in-out
            hover:bg-[var(--active-bg)] hover:scale-[1.02] active:scale-95" [class.justify-center]="collapsed()">

        <span class="material-symbols-outlined icon transition-transform duration-300 group-hover:rotate-6">
          {{ item.iconName }}
        </span>

        @if (!collapsed()) {
        <span class="ml-3 font-medium transition-colors duration-300 group-hover:text-white">
          {{ item.label }}
        </span>
        } @else {
        <span class="absolute left-16 bg-[#1e1e1e] text-white text-xs px-3 py-1.5 rounded-md border border-white/10
                   opacity-0 group-hover:opacity-100 transition-all duration-200 
                   translate-x-[-10px] group-hover:translate-x-0 whitespace-nowrap shadow-2xl pointer-events-none">
          {{ item.label }}
        </span>
        }
      </a>
      }

    </nav>

    <!-- USER -->
    <div class="mt-auto px-3 pt-4 border-t border-[var(--sidebar-border)]">
      <div class="flex items-center p-2 rounded-xl hover:bg-[var(--sidebar-bg-hover)] cursor-pointer transition"
        [class.justify-center]="collapsed()">

        <div class="relative">
          <img src="https://ui-avatars.com/api/?name=Ricardo&background=4A90E2&color=fff"
            class="w-9 h-9 rounded-lg border border-[var(--sidebar-border)]">
          <div
            class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-green-500 border-2 border-[var(--sidebar-bg)] rounded-full">
          </div>
        </div>

        @if (!collapsed()) {
        <div class="ml-3">
          <p class="text-sm font-semibold text-white truncate">Dr. Ricardo</p>
          <p class="text-[11px] text-[var(--sidebar-text)] truncate">Administrador</p>
        </div>
        }
      </div>
    </div>
  </aside>

  <!-- CONTENT -->
  <main class="flex-1 overflow-y-auto bg-slate-100">
    <header class="h-24 border-b border-slate-300 bg-slate-100 backdrop-blur flex flex-col justify-center px-8">
      <h1 class="text-2xl font-bold">Painel de Comando Alehao</h1>
      <p class="text-slate-500">Monitoramento em tempo real de bem-estar animal</p>
    </header>

    <div class="p-8">
      <router-outlet />
    </div>
  </main>
</div>
