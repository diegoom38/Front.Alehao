<!-- Lista de Casos em Cards - Portal Institucional Alehao -->
<app-base-card>
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-8xl pb-4 mx-auto flex items-center justify-between">
      <div class="flex flex-col md:flex-row gap-3 w-full">
        <app-input class="w-full md:w-[220px]" placeholder="Maus tratos" label="Buscar casos"></app-input>
        <app-select class="w-full md:w-[220px]" [options]="statusOptions()" label="Status"></app-select>
      </div>
    </div>
  </header>

  <main class="max-w-8xl mx-auto py-8">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
      @for (item of [].constructor(8); track $index) {
      <app-base-card type="button" [routerLink]="['../detalhes', 2031]"
        >
        <div class="flex justify-between items-center mb-4">
          <span class="text-[10px] font-bold tracking-wider text-slate-400 uppercase">#AHL-2031</span>
          <span
            class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-50 text-red-700 ring-1 ring-inset ring-red-600/10">
            <span class="w-1.5 h-1.5 mr-1.5 rounded-full bg-red-600"></span>
            Alta
          </span>
        </div>

        <h3
          class="text-base font-semibold text-slate-800 leading-tight mb-4 group-hover:text-blue-600 transition-colors">
          Maus-tratos a animal doméstico
        </h3>

        <div class="grid grid-cols-1 gap-2 border-t border-slate-50 pt-4">
          <div class="flex items-center text-sm text-slate-500">
            <svg class="w-4 h-4 mr-2 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
            São Paulo, SP
          </div>
          <div class="flex items-center text-sm text-slate-500">
            <svg class="w-4 h-4 mr-2 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
            João Silva
          </div>
          <div class="flex items-center text-sm text-slate-500">
            <svg class="w-4 h-4 mr-2 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
            02 Abr 2026
          </div>
        </div>

        <div class="mt-5 flex justify-between items-center">
          <span class="px-2.5 py-1 text-xs font-semibold rounded-lg bg-amber-50 text-amber-700 border border-amber-100">
            Em andamento
          </span>
          <div class="p-2 rounded-full bg-slate-50 group-hover:bg-blue-50 group-hover:text-blue-600 transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
          </div>
        </div>
      </app-base-card>
      }
    </div>

    <!-- Paginação -->
    <div class="flex justify-between items-center mt-8 text-sm text-slate-500">
      <span>Mostrando 1–3 de 120 casos</span>

      <div class="flex gap-2">
        <button class="px-3 py-1 border rounded-md">Anterior</button>
        <button class="px-3 py-1 border rounded-md bg-slate-900 text-white">1</button>
        <button class="px-3 py-1 border rounded-md">2</button>
        <button class="px-3 py-1 border rounded-md">3</button>
        <button class="px-3 py-1 border rounded-md">Próximo</button>
      </div>
    </div>

  </main>
</app-base-card>
