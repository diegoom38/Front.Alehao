<!-- HEADER -->
<header class="border-b" [style.background-color]="'var(--bg-secondary)'"
  [style.border-color]="'var(--border-primary)'">
  <div class="max-w-8xl pb-4 mx-auto flex items-center justify-between">

    <div class="flex flex-col md:flex-row gap-3 w-full">
      <app-input class="w-full md:w-[220px]" placeholder="Maus tratos" label="Buscar casos"></app-input>
      <app-select class="w-full md:w-[220px]" [options]="statusOptions()" label="Status"></app-select>
    </div>

  </div>
</header>

<!-- CONTENT -->
<main class="max-w-8xl mx-auto py-8">

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">

    @for (item of [].constructor(8); track $index) {

    <app-base-card type="button" [routerLink]="['../detalhes', 2031]"
      class="group hover:shadow-md transition cursor-pointer">

      <!-- TOP -->
      <div class="flex justify-between items-center mb-4">

        <span class="text-[10px] font-bold tracking-wider uppercase" [style.color]="'var(--text-muted)'">
          #AHL-2031
        </span>

        <app-tag label="Alta" color="red"></app-tag>
      </div>

      <!-- TITLE -->
      <h3 class="text-base font-semibold leading-tight mb-4 transition-colors" [style.color]="'var(--text-primary)'">
        Maus-tratos a animal doméstico
      </h3>

      <!-- INFO -->
      <div class="grid gap-2 pt-4 border-t" [style.border-color]="'var(--border-primary)'">

        <!-- Local -->
        <div class="flex items-center text-sm gap-2" [style.color]="'var(--text-secondary)'">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          São Paulo, SP
        </div>

        <!-- Responsável -->
        <div class="flex items-center text-sm gap-2" [style.color]="'var(--text-secondary)'">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
          João Silva
        </div>

        <!-- Data -->
        <div class="flex items-center text-sm gap-2" [style.color]="'var(--text-secondary)'">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
          02 Abr 2026
        </div>

      </div>

      <!-- FOOTER -->
      <div class="mt-5 flex justify-between items-center">

        <app-tag label="Em andamento" color="yellow"></app-tag>

        <div class="p-2 rounded-full transition" [style.background-color]="'var(--bg-tertiary)'">
          <svg class="w-4 h-4 transition" [style.color]="'var(--text-secondary)'" viewBox="0 0 24 24" fill="none"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </div>

      </div>

    </app-base-card>
    }

  </div>

  <app-paginator></app-paginator>

</main>
