  <main class="grid gap-6">
    <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-6">
      <div class="flex items-center gap-4">
        <div
          class="w-16 h-16 rounded-2xl flex items-center justify-center border shadow-sm bg-[var(--bg-secondary)] border-[var(--border-primary)]">
          <span class="material-symbols-outlined text-3xl text-[var(--color-primary)]"> pets </span>
        </div>

        <div>
          <p class="text-xs uppercase tracking-wide font-bold text-[var(--text-muted)]">
            Protocolo de Adoção
          </p>

          <h2 class="text-2xl font-bold text-[var(--text-primary)]">
            Pipoca
            <span class="font-light text-lg ml-2 text-[var(--text-muted)]"> #PET-2031 </span>
          </h2>

          <p class="text-sm italic text-[var(--text-secondary)]">
            Resgatado em 02/04/2026 • São Paulo - SP
          </p>
        </div>
      </div>

      <div class="flex flex-wrap gap-3 items-center">
        <div
          class="flex items-center gap-3 px-4 py-2 rounded-xl border bg-[var(--bg-secondary)] border-[var(--border-primary)]">
          <span class="text-sm font-medium text-[var(--text-secondary)]"> Vitrine Pública: </span>

          <app-toggle-switch></app-toggle-switch>

          <span class="text-xs font-bold uppercase text-[var(--color-primary)]"> Ativo </span>
        </div>

        <app-button label="Visualizar no Portal" type="secondary"></app-button>
        <app-button label="Salvar Alterações"></app-button>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <div class="lg:col-span-2 flex flex-col gap-4">
        <app-base-card>
          <div class="flex items-center justify-between mb-4">
            <h3 class="text-lg font-semibold flex items-center gap-2 text-[var(--text-primary)]">
              <span class="material-symbols-outlined text-[var(--color-primary)]"> edit_note </span>
              Descrição da PDP
            </h3>

            <span
              class="text-[10px] px-2 py-1 rounded uppercase italic bg-[var(--bg-tertiary)] text-[var(--text-muted)]">
              HTML / Editor
            </span>
          </div>

          <app-rich-text></app-rich-text>
        </app-base-card>

        <app-base-card>
          <div class="flex items-center justify-between mb-4">
            <h3 class="text-lg font-semibold text-[var(--text-primary)]">Galeria de Vitrine</h3>

            <app-button label="Adicionar Fotos" type="secondary" size="sm"></app-button>
          </div>

          <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div
              class="aspect-square rounded-xl border-2 border-dashed flex flex-col items-center justify-center gap-2 cursor-pointer transition border-[var(--border-primary)] bg-[var(--bg-tertiary)]">
              <span class="material-symbols-outlined text-[var(--text-muted)]"> add_a_photo </span>
              <span class="text-[10px] font-bold uppercase text-[var(--text-muted)]"> Capa </span>
            </div>

            <div class="relative aspect-square rounded-xl overflow-hidden group bg-[var(--bg-tertiary)]">
              <div class="absolute top-2 right-2 opacity-0 group-hover:opacity-100 transition">
                <button class="p-1 rounded shadow-sm bg-red-500 text-white">
                  <span class="material-symbols-outlined text-xs">delete</span>
                </button>
              </div>

              <div class="w-full h-full flex items-center justify-center">
                <span class="material-symbols-outlined text-4xl text-[var(--text-muted)]">
                  image
                </span>
              </div>
            </div>
          </div>
        </app-base-card>
      </div>

      <aside class="flex flex-col gap-4">
        <app-base-card header="Situação do Processo">
          <p class="text-xl font-bold text-[var(--text-primary)]">Pronto para Adoção</p>

          <div class="mt-2 pt-2">
            <div class="flex justify-between text-xs text-[var(--text-secondary)]">
              <span>Saúde</span>
              <span>100%</span>
            </div>

            <div class="w-full h-1.5 rounded-full mt-1 bg-[var(--border-primary)]">
              <div class="h-full rounded-full w-full bg-[var(--color-primary)]"></div>
            </div>
          </div>
        </app-base-card>

        <app-base-card header="Informações Básicas">
          <div class="space-y-3">
            <div>
              <p class="text-[10px] text-[var(--text-muted)]">Espécie / Raça</p>
              <p class="text-sm font-semibold text-[var(--text-primary)]">Cão • Vira-lata (SRD)</p>
            </div>

            <div>
              <p class="text-[10px] text-[var(--text-muted)]">Idade</p>
              <p class="text-sm font-semibold text-[var(--text-primary)]">2 anos</p>
            </div>
          </div>
        </app-base-card>

        <app-base-card header="Gestão do Processo">
          <app-button label="Marcar como Adotado" [fullWidth]="true" type="success"></app-button>
        </app-base-card>
      </aside>
    </div>
  </main>
