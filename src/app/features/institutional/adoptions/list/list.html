<app-base-card>
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-8xl pb-4 mx-auto flex items-center justify-between">
      <div class="flex flex-col md:flex-row gap-3 w-full">
        <app-input class="w-full md:w-[280px]" placeholder="Nome do animal ou protocolo" label="Buscar adoções">
        </app-input>
        <app-select class="w-full md:w-[220px]" [options]="statusOptions()" label="Situação"></app-select>
      </div>
    </div>
  </header>

  <main class="max-w-8xl mx-auto py-8">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">

      @for (adocao of [].constructor(8); track $index) {
      <app-base-card type="button" class="group transition-all hover:border-blue-200">
        <div class="flex justify-between items-center mb-4">
          <span class="text-[10px] font-bold tracking-wider text-slate-400 uppercase">#PET-2026-{{$index}}</span>
          <app-tag label="Em analise" color="amber"></app-tag>
        </div>

        <div class="flex items-center gap-4 mb-5">
          <div
            class="w-14 h-14 rounded-xl bg-slate-100 flex-shrink-0 flex items-center justify-center overflow-hidden border border-slate-50">
            <span class="material-symbols-outlined text-slate-300 text-3xl">pets</span>
          </div>
          <div>
            <h3 class="text-lg font-bold text-slate-900 leading-tight group-hover:text-blue-600 transition-colors">
              Pipoca
            </h3>
            <p class="text-xs text-slate-500 font-medium">Vira-lata (SRD)</p>
          </div>
        </div>

        <div class="grid grid-cols-1 gap-3 border-t border-slate-50 pt-4">
          <div class="flex items-center text-sm text-slate-600">
            <span class="material-symbols-outlined text-slate-400 text-[18px] mr-2">location_on</span>
            Abrigo Central - SP
          </div>

          <div class="flex items-center text-sm text-slate-500">
            <span class="material-symbols-outlined text-slate-400 text-[18px] mr-2">event_note</span>
            Solicitado em 15 Abr 2026
          </div>
        </div>

        <div class="mt-5 flex justify-between items-center">
          <span class="text-[11px] text-slate-400 font-medium">
            Aguardando entrevista
          </span>
          <div class="flex items-center text-blue-600 text-sm font-bold">
            Detalhes
            <span
              class="material-symbols-outlined text-[18px] ml-1 group-hover:translate-x-1 transition-transform">chevron_right</span>
          </div>
        </div>
      </app-base-card>
      }
    </div>
    <app-paginator></app-paginator>
  </main>
</app-base-card>
