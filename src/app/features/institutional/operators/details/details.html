<!-- Tela de Detalhe do Operador -->
<app-base-card>

  <header class="bg-white border-b border-slate-200">
    <div class="max-w-8xl mx-auto pb-4 flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">João Silva</h1>
        <p class="text-sm text-slate-500">Detalhes do operador</p>
      </div>

      <app-button label="Editar">
      </app-button>
    </div>
  </header>

  <main class="max-w-8xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-4 mt-8">

    <!-- Infos -->
    <div class="grid gap-4">
      <app-base-card>
        <h3 class="text-sm text-slate-500 mb-1">Status</h3>
        <p class="font-semibold text-green-600">Ativo</p>
      </app-base-card>

      <app-base-card>
        <h3 class="text-sm text-slate-500 mb-1">Email</h3>
        <p class="text-sm text-slate-700">joao@email.com</p>
      </app-base-card>

      <app-base-card>
        <h3 class="text-sm text-slate-500 mb-1">Casos ativos</h3>
        <p class="font-semibold text-slate-900">12</p>
      </app-base-card>
    </div>

    <!-- Casos do operador -->
    <div class="lg:col-span-2 ">
      <app-base-card>
        <h3 class="text-lg font-semibold mb-4">Casos atribuídos</h3>

        <div class="grid gap-4">
          <app-base-card  class="flex justify-between items-center w-full">
            <div>
              <p class="font-medium">#AHL-2031</p>
              <p class="text-sm text-slate-500">Maus-tratos</p>
            </div>
            <span class="text-xs px-2 py-1 rounded-md bg-yellow-100 text-yellow-700">Em andamento</span>
          </app-base-card>

          <app-base-card class="flex justify-between items-center w-full">
            <div>
              <p class="font-medium">#AHL-2025</p>
              <p class="text-sm text-slate-500">Abandono</p>
            </div>
            <span class="text-xs px-2 py-1 rounded-md bg-red-100 text-red-600">Alta</span>
          </app-base-card>

        </div>
      </app-base-card>
    </div>

  </main>
</app-base-card>
