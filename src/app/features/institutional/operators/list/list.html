<app-base-card>  <!-- Lista de Operadores (Cards estilo curso) -->
  <div class="max-w-8xl mx-auto">

    <!-- Filtros -->
    <div
      class="flex justify-between items-end pb-4 md:flex-row md:items-end flex-col gap-4 bg-white border-b border-slate-200">
      <div class="flex flex-col md:flex-row gap-3 w-full">
        <app-input class="w-full md:w-[220px]" label="Buscar por nome" placeholder="João da Silva"></app-input>
        <app-select class="w-full md:w-[220px]" [options]="statusOptions()" label="Status"></app-select>
      </div>

      <app-button class="min-w-[175px]" label="Novo Operador">
      </app-button>
    </div>

    <!-- Grid de cards -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 pt-8">

      @for (item of [].constructor(8); track $index) {
      <!-- Card Operador -->

      <app-base-card [routerLink]="['../detalhes', 2031]">
        <div class="flex items-center gap-4 mb-4">
          <div class="w-12 h-12 rounded-full bg-slate-200 flex items-center justify-center text-sm font-bold">JS</div>
          <div>
            <p class="font-semibold text-slate-900">João Silva</p>
            <p class="text-xs text-slate-500">Operador</p>
          </div>
        </div>

        <div class="text-sm text-slate-600 space-y-1">
          <p>📊 12 casos ativos</p>
          <p>⚡ 3 alta prioridade</p>
        </div>

        <div class="mt-4 flex justify-between items-center">
          <span class="px-2 py-1 text-xs rounded-md bg-green-100 text-green-700">Ativo</span>
          <span class="text-slate-400">→</span>
        </div>
      </app-base-card>
      }

    </div>
  </div>
</app-base-card>
